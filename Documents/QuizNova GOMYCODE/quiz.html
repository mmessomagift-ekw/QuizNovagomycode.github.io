<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizNova | Mon quiz</title>
  <link rel="icon" href="QuizNova_Favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="quiz-page">

  <header class="quiz-header">
    <a href="index.html">
      <img src="QuizNova_Navigation.png" alt="QuizNova" class="quiz-logo">
    </a>
    <a href="index.html" class="quiz-exit">Quitter le quiz</a>
  </header>

  <main class="quiz-container">
    <section class="quiz-card" id="quiz-card">
      <div class="quiz-top">
        <div>
          <span class="quiz-label" id="quiz-space">ESPACE QUIZ</span>
          <h1 id="quiz-category">Chargement...</h1>
        </div>
        <div class="quiz-counter" id="quiz-counter">Question 1</div>
      </div>

      <div class="quiz-progress">
        <div id="quiz-progress-bar"></div>
      </div>

      <div class="quiz-meta">
        <span id="quiz-level"></span>
        <span id="quiz-timer">⏱ 30 s</span>
      </div>

      <h2 id="question-text">Préparation de votre quiz...</h2>

      <div id="answer-list" class="answer-list"></div>

      <div id="feedback" class="quiz-feedback" aria-live="polite"></div>

      <button id="next-button" class="quiz-next" disabled>
        Question suivante
      </button>
    </section>

    <section class="quiz-card quiz-result" id="result-card" hidden>
      <div class="result-icon">🏆</div>
      <span class="quiz-label">QUIZNOVA</span>
      <h1 id="result-title">Quiz terminé !</h1>
      <p id="result-message"></p>

      <div class="result-score">
        <strong id="final-score">0/0</strong>
        <span>Votre score</span>
      </div>

      <p id="result-detail"></p>

      <div class="result-actions">
        <button id="restart-button" class="quiz-next">Recommencer</button>
        <a href="index.html" class="quiz-home">Retour à l'accueil</a>
      </div>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
